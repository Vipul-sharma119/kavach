<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" role="img" aria-label="PSARA Licensed and Verified — Govt. of Madhya Pradesh, Act 2005">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141E30"/>
      <stop offset="100%" stop-color="#0B111E"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D382"/>
      <stop offset="50%" stop-color="#D8A93B"/>
      <stop offset="100%" stop-color="#B8861E"/>
    </linearGradient>
    <linearGradient id="goldIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBE6A2"/>
      <stop offset="100%" stop-color="#D8A93B"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Pill Background -->
  <rect x="1" y="1" width="318" height="58" rx="29" ry="29" fill="url(#bgDark)" stroke="url(#goldStroke)" stroke-width="1.4" filter="url(#softGlow)"/>

  <!-- Shield Icon Container -->
  <g transform="translate(14, 10)">
    <!-- Outer Shield -->
    <path d="M20 2 L35.5 7.8 V19.5 C35.5 29.5 28.8 36.8 20 39.2 C11.2 36.8 4.5 29.5 4.5 19.5 V7.8 L20 2 Z" 
          fill="none" 
          stroke="url(#goldIcon)" 
          stroke-width="2.2" 
          stroke-linejoin="round"/>
    <!-- Subtle Shield Inner Highlight -->
    <path d="M20 5 L32.5 9.8 V19.5 C32.5 27.5 27.2 33.6 20 35.7 C12.8 33.6 7.5 27.5 7.5 19.5 V9.8 L20 5 Z" 
          fill="#D8A93B" 
          fill-opacity="0.08"/>
    <!-- Verified Checkmark -->
    <path d="M13.5 20 L18 24.5 L26.5 15.5" 
          fill="none" 
          stroke="url(#goldIcon)" 
          stroke-width="2.8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(64, 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Title -->
    <text x="0" y="27" 
          fill="#FFFFFF" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="-0.01em">PSARA Licensed &amp; Verified</text>
    <!-- Subtitle / Statutory Reference -->
    <text x="0" y="44" 
          fill="#E5BD5D" 
          font-size="11" 
          font-weight="500" 
          letter-spacing="0.01em">Govt. of Madhya Pradesh • Act 2005</text>
  </g>
</svg>
